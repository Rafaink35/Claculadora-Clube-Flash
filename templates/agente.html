<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mingo — Clube Flash</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#FE2B8F">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mingo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .chat-shell{
    max-width:720px;
    margin:0 auto;
    padding:calc(28px + env(safe-area-inset-top, 0px)) 20px calc(40px + env(safe-area-inset-bottom, 0px));
    height:100%;
    display:flex;
    flex-direction:column;
  }
  html, body{ height:100%; }
  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:8px 2px 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:82%;
    padding:11px 15px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--rosa);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg.assistant{
    align-self:flex-start;
    background:var(--paper-tint);
    border:1px solid var(--line);
    color:var(--ink);
    border-bottom-left-radius:4px;
  }
  .form-contato{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-width:88%;
  }
  .form-contato-titulo{ font-size:13.5px; margin-bottom:4px; }
  .form-contato-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin:2px 0 -2px; }
  .form-contato input{
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--input-bg);
    color:var(--ink);
    font-family:"Nunito Sans", sans-serif;
    font-size:13.5px;
  }
  .cta-comercial-btn{
    border:1px solid var(--rosa);
    background:transparent;
    color:var(--rosa-dark2);
    font-family:"Nunito Sans", sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
  }
  .cta-comercial-btn:hover{ background:var(--rosa); color:#fff; }
  .cta-comercial-btn:disabled{ opacity:0.6; cursor:default; }

  .form-contato button{
    border:none;
    background:var(--rosa);
    color:#fff;
    font-family:"Nunito Sans", sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:9px;
    border-radius:8px;
    cursor:pointer;
  }
  .form-contato button:disabled{ opacity:0.6; cursor:default; }
  .fc-status{ font-size:12px; color:var(--ink-soft); min-height:14px; }

  .msg.thinking{
    align-self:flex-start;
    background:var(--paper-tint);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-style:italic;
  }
  .chat-input-row{
    display:flex;
    gap:10px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .chat-input-row input{
    flex:1;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--input-bg);
    color:var(--ink);
    font-family:"Nunito Sans", sans-serif;
    font-size:14.5px;
  }
  .chat-input-row input:focus{ outline:2px solid var(--rosa); outline-offset:1px; }
  .chat-input-row button{
    border:none;
    background:var(--rosa);
    color:#fff;
    font-family:"Nunito Sans", sans-serif;
    font-weight:700;
    font-size:14px;
    padding:0 20px;
    border-radius:10px;
    cursor:pointer;
  }
  .chat-input-row button:disabled{ opacity:0.6; cursor:wait; }
  .chat-suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
  }
  .suggestion-chip{
    border:1px solid var(--rosa-light2);
    background:transparent;
    color:var(--rosa-dark2);
    font-family:"Nunito Sans", sans-serif;
    font-size:12.5px;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  @media (prefers-color-scheme: dark){ .suggestion-chip{ color: var(--rosa-light2); } }
</style>
</head>
<body>
<div class="chat-shell">
  <div class="topbar">
    <div class="wordmark">Clube <span>Flash</span></div>
    <div class="kicker">🦩 Mingo do Clube</div>
  </div>

  <div class="chat-suggestions" id="suggestions">
    <button class="suggestion-chip" data-msg="Quero saber quais as vantagens do clube de vocês para meus colaboradores">Vantagens do clube pros meus colaboradores</button>
    <button class="suggestion-chip" data-msg="Por que a Flash não oferece rebate como outros concorrentes?">Dúvidas sobre rebate</button>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <form class="chat-input-row" id="chatForm">
    <input type="text" id="chatInput" placeholder="Pergunte algo ou dê o número de colaboradores..." autocomplete="off">
    <button type="submit" id="sendBtn">Enviar</button>
  </form>
</div>

<script src="{{ url_for('static', filename='agente.js') }}"></script>
</body>
</html>
